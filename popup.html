<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Anime3rb Ad Blocker</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      height: 440px;
      overflow: hidden;
      background: #07090f;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
    }

    /* ── Background ── */
    .bg {
      position: absolute; inset: 0;
      background: url('bg.png') center / cover no-repeat;
      filter: brightness(.22) saturate(1.8);
      z-index: 0;
    }
    .bg-overlay {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(180deg,
          rgba(5,8,22,.55) 0%,
          rgba(20,6,55,.4) 45%,
          rgba(5,8,22,.95) 100%);
    }

    /* ── Scanlines ── */
    .scanlines {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,.045) 2px, rgba(0,0,0,.045) 4px
      );
    }

    /* ── Content ── */
    .content {
      position: relative; z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px 26px;
    }

    /* Main logo — centered */
    .main-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      filter: drop-shadow(0 6px 24px rgba(99,102,241,.5));
    }

    /* ── Bottom section ── */
    .bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      width: 100%;
    }

    /* GitHub button */
    .gh-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background .2s, border-color .2s, color .2s, transform .15s;
      cursor: pointer;
      letter-spacing: .01em;
    }
    .gh-btn:hover {
      background: rgba(99,102,241,.18);
      border-color: rgba(99,102,241,.45);
      color: #e2e8f0;
      transform: translateY(-1px);
    }
    .gh-btn svg {
      flex-shrink: 0;
      opacity: .65;
      transition: opacity .2s;
    }
    .gh-btn:hover svg { opacity: .9; }

    /* Copyright */
    .copy {
      font-size: 10px;
      color: rgba(100,116,139,.65);
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .copy-author {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 700;
      color: #7c3aed;
      text-shadow: 0 0 10px rgba(124,58,237,.55);
      letter-spacing: .06em;
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="bg-overlay"></div>
<div class="scanlines"></div>

<div class="content">

  <img class="main-logo" src="cat.png" alt="Anime3rb Ad Blocker"/>

  <div class="bottom">
    <a class="gh-btn" href="https://github.com/iiMrDark/anime3rb-adblocker" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      github.com/iiMrDark
    </a>
    <div class="copy">
      © 2026 <span class="copy-author">iiMrDark</span> · crafted in the dark
    </div>
  </div>

</div>

</body>
</html>
